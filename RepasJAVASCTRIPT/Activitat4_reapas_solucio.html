<html>
    <head></head>
    <body>
        <input id="num1">
        <input id="num2">
        <button onclick="resta()">Resta</button>
        <p id="resultat">Resultat</p>

        <script>
            // Aquí el nostre codi
            // Declarar les variables necessàries amb let i buscar al DOM els elements que farem servir

            let n1 = document.getElementById("num1");
            let n2 = document.getElementById("num2");
            let resultat = document.getElementById("resultat");

            function resta()
            {
                let num = Number(n1.value) - Number(n2.value);
                resultat.textContent = num;
            }
        </script>
    </body>
</html>
